# katamari-nx (Beautiful Katamari, title 4E4D07DC, XDK 2.0.5632) - ReXGlue codegen configuration.
# The project keeps banjo-nx's internal name "renut" (generated/renut_*.h, the renut / renut_recomp targets,
# out/renut_image.bin) so banjo-nx's CMake, post-codegen passes and renderer glue work unchanged; the NRO and the SD
# folder are katamari-nx (docs/katamari-notes.md, "Decisions").

includes = [
"config/renut_funcs.toml",
"config/renut_hooks.toml",
"overrides.toml",
]

# banjo-nx's optimised codegen keys that need no per-game audit (they change how the C++ is written, not what the
# guest sees; banjo-nx's renut_config.toml carries the reasoning and the console measurements for each):
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
fcti_inline = true
dcbt_prefetch = true
rotate_word_shifts = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = true
fp_copy_pairs = true
fp_copy_forwarding = true
div_inline = true
fp_moves_modeless = true
# The register "diet" keys (2026-10-30 evening, the user's request: every codegen option banjo-nx uses). Audited for
# Beautiful Katamari on a codegen without them (out/audit/gen; docs/katamari-notes.md, "Codegen options"):
#   - non_volatile_as_local (r14-r31, f14-f31, v14-v31/v64-v127 as C++ locals: the __savegprlr / __restgprlr helpers
#     and the guest-stack traffic for those registers disappear; on ARM those helpers were ~20 % of the main thread's
#     samples): tools/read_before_write.py --noreturn=827EB3B0 finds no function that reads a non-volatile register its
#     caller set up: run on code generated WITH the option (out/audit/gen2; the tool reads registers spelled as locals,
#     a first run on code without it saw none): 51 functions. 44 split pieces get share_registers
#     (config/renut_funcs.toml, overrides.toml); setjmp and its four callers save CR / XER / registers into the jump
#     buffer, which the codegen handles; v69 / v72 are kept in ctx (below).
#   - elide_lr_stores (no `ctx.lr = <return address>` before every call): the link register is read only by prologue
#     saves, setjmp / longjmp (handled at their call sites by the codegen) and the C runtime's exception helpers
#     (sub_827EA780, sub_827F8FF0, sub_827F9130, sub_827F91DC, sub_827F9200), which save and restore it; the runtime
#     never runs the guest's exception dispatch (banjo-nx's audit, the same runtime).
#   - non_argument_as_local (r0, r2, r11, r12, f0, v32-v63 as C++ locals): tools/non_argument_audit.py
#     --noreturn=827EB3B0: ENTRY 6,595 (218 save / restore helpers, kept by name; 6,357 MSVC unwind funclets reading the
#     frame in r12, `addi r31,r12,-N`, reached only through the exception dispatchers; sub_82443960 and sub_82447C68
#     taking r11; a vector codec family that saves / restores v32-v63 through sub_829E70A8 / sub_829E73F0), RET 14,
#     HANDOVER 0. Every ENTRY and RET function is kept (6379 below); their callers hand the registers over.
non_volatile_as_local = true
# v64-v127 stay in ctx in every function (2026-10-31; rc2/rc3 kept only v69 and v72, and every movie decoded into
# green blocks on the console and in Ryujinx, rc1 clean). The movies' codec keeps constants in VMX128 registers across
# its calls: sub_829E70A8 saves v32-v127 into a buffer and then loads nine constant vectors into v64-v72 from a table,
# its callers (sub_829E3628 ... sub_829E6CF0, sub_825EADF8, sub_82A01D88) run the decoder, which reads them, and
# sub_829E73F0 restores v32-v127 at the end. As locals, the nine loads died with the helper's frame and the decoder
# read zeros (v69 and v72, already kept here because sub_82627520 / sub_82627B58 read them first, were the only two
# it got). Only about 40 functions name a register above v31, so keeping the whole range costs almost nothing; their
# saves and restores of v64-v127 are then real calls again, as on the Xbox 360.
non_volatile_as_local_keep = ["v64-v127"]
elide_lr_stores = true
non_argument_as_local = true
