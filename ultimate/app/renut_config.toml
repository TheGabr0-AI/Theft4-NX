# Theft4-NX (Grand Theft Auto IV, Europe, base default.xex without a title update: media ID 4A53F9F6, version
# 0.0.0.6, XDK 2.0.6274) - ReXGlue 0.10 codegen configuration on renut_nx_ultimate_base
# (docs/switch-port/20-ultimate-base-migration.md, phase U3). It replaces Beautiful Katamari's configuration.
# The project keeps banjo-nx's internal name "renut" (generated/renut_*.h, the renut / renut_recomp targets,
# out/renut_image.bin) so the base's CMake, post-codegen passes and renderer glue work unchanged.

includes = [
"config/renut_funcs.toml",
"config/gta4_eu_base_gaps_bulk.toml",
"config/renut_hooks.toml",
"overrides.toml",
]

# The base's codegen keys that need no per-game audit (banjo-nx: they change how the C++ is written, not what the
# guest sees; banjo-nx's renut_config.toml carries the reasoning and the console measurements for each). The base
# keeps them on for every port.
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
fcti_inline = true
dcbt_prefetch = true
rotate_word_shifts = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = true
fp_copy_pairs = true
fp_copy_forwarding = true
div_inline = true
fp_moves_modeless = true

# Registers as C++ locals. non_volatile_as_local (r14-r31, f14-f31, v14-v31) was audited for GTA IV on the 0.9
# generator (tools/switch-codegen/read_before_write.py; the five share_registers fragments in config/renut_funcs.toml)
# and shipped in every console run since run 20. v64-v127 stay in ctx, as the base advises (Katamari's movie codec
# kept constants in VMX128 registers across calls; about 40 functions name a register above v31). To audit again on
# this generator before the console: the base's tools/read_before_write.py on code generated with the option.
non_volatile_as_local = true
non_volatile_as_local_keep = ["v64-v127"]
# Not yet: elide_lr_stores and non_argument_as_local need the per-game audits Katamari did (tools/non_argument_audit.py,
# the setjmp / longjmp addresses by shape, the C runtime's exception helpers). Our 0.9 notes: non_argument_as_local
# breaks the r12 convention of __savevmx unless the save / restore helpers and the unwind funclets are kept.
elide_lr_stores = false
non_argument_as_local = false

[analysis]
max_jump_extension = 65536
data_region_threshold = 16
large_function_threshold = 1048576
