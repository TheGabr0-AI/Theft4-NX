# katamari-nx: named functions and function boundaries of Beautiful Katamari (docs/katamari-notes.md, "Code generation").
[functions]
# First codegen (2026-10-30): three "target not in any function", each a function reached only by a tail jump from a
# thunk, after its neighbour's blr / bctr and padding (tools/ppc_dis.py):
#   0x825387E8 from 0x82538814 (`addi r3,r3,-4; b 0x825387E8`): `addi r11,r3,4; lwz r10,4(r11); addi r3,r10,1;
#     stw r3,4(r11); blr` (an AddRef through an adjusted this).
#   0x8266DEA0 from 0x82270930 (`b 0x8266DEA0`): `mr r11,r4; mr r4,r3; mr r3,r11; lwz r10,0(r11); lwz r11,136(r10);
#     bctr` (a virtual call through the second argument's vtable, slot 34).
#   0x82408488 from 0x823DD968 (`addi r3,r11,288; b 0x82408488`): a table lookup that tail-calls sub_824A3650.
"0x825387E8" = { }
"0x8266DEA0" = { }
"0x82408488" = { }
# Second codegen: three "Unresolved conditional branch". Each target is a `li r3,0; blr` tail that the scanner left
# outside the function branching to it (0x822AC5C0's function ends at the blr before it; sub_82685530 is a registered
# start that branches back to 0x82685528, its entry stub's tail). Declared as functions of their own, the branches
# become conditional tail calls with the same effect (return 0). 0x82685520 (`cmplwi cr6,r4,0; bne cr6,0x82685530`,
# then the tail) is the entry stub of the function the scanner started at 0x82685530: declared as one function over
# the whole body (the generator emits no fall-through into a next function, and refuses overlapping declarations).
"0x822AC5E8" = { end = 0x822AC5F0 }
"0x82685520" = { end = 0x826855C8 }

# katamari-nx (2026-10-30 evening, the register-diet codegen): split pieces that read non-volatile registers their
# parent set up (tools/read_before_write.py on code generated WITH non_volatile_as_local, out/audit/gen2; the pieces
# also listed in overrides.toml carry the mark there). Without it sub_824CF3F8 read a zeroed r31 and handed a wrong
# frame to its __finally funclet: the boot crash of the first diet build.
